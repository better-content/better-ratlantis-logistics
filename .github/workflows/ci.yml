name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BC_CUSTOM_MOD_JAR_DIR: ${{ github.workspace }}/build/ci-provider-jars
      BC_BUMBLEZONE_CULTIVARS_SOURCE: ${{ github.workspace }}/build/ci-better-bumblezone-crops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check out pinned Cultivars provider
        uses: actions/checkout@v4
        with:
          repository: better-content/better-bumblezone-crops
          ref: 35fb49328c9f13630d8efde428ea668b60c08b14
          path: build/ci-better-bumblezone-crops
      - name: Stage pinned Cultivars provider and mapped Bumblezone runtime
        run: |
          ./build/ci-better-bumblezone-crops/gradlew -p build/ci-better-bumblezone-crops --no-daemon remapBumblezoneDevelopment stageRuntimeJar
          mkdir -p "$BC_CUSTOM_MOD_JAR_DIR"
          cp build/ci-better-bumblezone-crops/build/libs/better-bumblezone-crops-0.1.0.jar "$BC_CUSTOM_MOD_JAR_DIR/"
      - name: Verify repository
        run: ./gradlew --no-daemon verifyFull
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-verification
          path: |
            build/reports/
            build/test-results/
            build/ci-provider-jars/providers.json
          if-no-files-found: ignore
          retention-days: 14
